<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">Agentic data collection — planned in-Collector Dataverse export (OLS-4493)</title>
  <desc id="desc">Agentic operator and sandbox send standard OTLP traces to the shared Collector. A configured backend branch uses its own batch processor. An exact service-name route without a batch processor sends product traces to the dataverse exporter, which batches in memory (4 MiB or 5 minutes, 32 MiB queue, 1 hour retry) and uploads one gzip TAR per batch to the Red Hat ingress service through the cluster-wide proxy with the OpenShift TLS profile. The exporter reads the pull-secret token and cluster ID through the Kubernetes API. Queue-full and upload failures are not returned to producers or other consumers. No trace files, volumes, or sidecar exist. Classic export and compliance logs remain separate and unchanged.</desc>
  <defs>
    <style>
      .bg{fill:#f4f1ea}.planned{fill:#edf7f3;stroke:#087f6b;stroke-width:2}
      .producer{fill:#fff;stroke:#087f6b;stroke-width:2}.collector{fill:#fff;stroke:#3559b7;stroke-width:2}.backend{fill:#eaf0ff;stroke:#3559b7;stroke-width:2}
      .exporter{fill:#e7f5f2;stroke:#087f6b;stroke-width:2}.external{fill:#fff;stroke:#5b6971;stroke-width:1.6}.classic{fill:#eef2f4;stroke:#6b7780;stroke-width:1.6}
      .h1{font-size:24px;font-weight:700;fill:#1f2a30}.h2{font-size:16px;font-weight:700;fill:#1f2a30}.t{font-size:13px;fill:#2e3b42}.s{font-size:12px;fill:#55636b}
      .arrow{stroke:#3a474e;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#5b6971;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a474e"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="h1" x="40" y="48">Agentic data collection — in-Collector Dataverse export</text>
  <text class="s" x="40" y="72">PLANNED: OLS-4493 · replaces the released FileExporter branch and the otel-mode sidecar · decision 0052</text>

  <rect class="planned" x="30" y="92" width="1140" height="470" rx="14"/>

  <rect class="producer" x="60" y="130" width="230" height="110" rx="10"/>
  <text class="h2" x="76" y="158">Agentic producers</text>
  <text class="t" x="76" y="182">agentic-operator + batch sandbox</text>
  <text class="t" x="76" y="202">standard OTLP trace spans</text>
  <text class="s" x="76" y="222">no product files, no collection state</text>

  <rect class="collector" x="340" y="120" width="300" height="130" rx="10"/>
  <text class="h2" x="356" y="148">lightspeed-otel-collector</text>
  <text class="t" x="356" y="172">otlp receiver → traces pipeline (fan-out)</text>
  <text class="t" x="356" y="194">routing/data_collection: exact service.name</text>
  <text class="s" x="356" y="214">lightspeed-agentic-operator | lightspeed-agentic-sandbox</text>
  <text class="s" x="356" y="234">gate: transcripts enabled + cloud.openshift.com token</text>

  <rect class="backend" x="700" y="120" width="440" height="80" rx="10"/>
  <text class="h2" x="716" y="148">Configured trace backend (independent)</text>
  <text class="t" x="716" y="172">routing/traces → batch processor → otlp/tracing, own queue</text>
  <text class="s" x="716" y="190">never sees dataverse exporter failures</text>

  <rect class="exporter" x="340" y="300" width="420" height="230" rx="10"/>
  <text class="h2" x="356" y="328">dataverse exporter · traces/data_collection</text>
  <text class="t" x="356" y="354">exporterhelper in-memory queue: bytes sizer, 32 MiB, 1 consumer</text>
  <text class="t" x="356" y="376">batch flush at 4 MiB or 5 minutes; retry 1 hour with backoff</text>
  <text class="t" x="356" y="398">ptrace JSON trace-batch object → one-element JSON array</text>
  <text class="t" x="356" y="420">gzip TAR member agentic-v1/traces-&lt;time&gt;-&lt;hex&gt;.json</text>
  <text class="t" x="356" y="442">queue full → spans dropped and counted, success returned</text>
  <text class="t" x="356" y="464">TLS: effective OpenShift profile; CA: injected trusted bundle</text>
  <text class="t" x="356" y="486">proxy: https_proxy / no_proxy from the Collector environment</text>
  <text class="s" x="356" y="512">info log per upload: request_id, archive_member, spans, payload_bytes</text>

  <rect class="external" x="820" y="300" width="320" height="90" rx="10"/>
  <text class="h2" x="836" y="328">Kubernetes API (direct, no proxy)</text>
  <text class="t" x="836" y="352">pull-secret → cloud.openshift.com token</text>
  <text class="t" x="836" y="372">ClusterVersion → clusterID (cached)</text>

  <rect class="external" x="820" y="420" width="320" height="110" rx="10"/>
  <text class="h2" x="836" y="448">console.redhat.com ingress</text>
  <text class="t" x="836" y="472">POST /api/ingress/v1/upload, multipart</text>
  <text class="t" x="836" y="492">HTTP 202 + request_id = acknowledged</text>
  <text class="s" x="836" y="514">→ Dataverse extraction and analytics</text>

  <path class="arrow" d="M290 185H338"/>
  <path class="arrow" d="M640 160H698"/>
  <path class="arrow" d="M490 250V298"/>
  <path class="dash" d="M760 345H818"/>
  <path class="arrow" d="M760 475H818"/>

  <rect class="classic" x="30" y="590" width="1140" height="50" rx="10"/>
  <text class="h2" x="46" y="620">Classic path · unchanged</text>
  <text class="t" x="290" y="620">Classic transcript/feedback files → app-server Dataverse exporter sidecar (json mode) → existing upload</text>

  <rect class="classic" x="30" y="652" width="1140" height="50" rx="10"/>
  <text class="h2" x="46" y="682">Compliance logs · unchanged</text>
  <text class="t" x="290" y="682">Agentic OTLP logs → templog → PostgreSQL only; never part of product collection</text>
</svg>
